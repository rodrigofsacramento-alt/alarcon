version: "3.8"

services:
  evolution_redis:
    image: redis:latest
    container_name: evolution_redis
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
    expose:
      - "6379"

  evolution_db:
    image: postgres:15
    container_name: evolution_db
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      - POSTGRES_DB=evolution_db
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolution_pass
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data

  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: always
    deploy:
      resources:
        limits:
          memory: 1024M
    ports:
      - "8080:8080"
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=indavent_api_key_2026
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution_pass@evolution_db:5432/evolution_db?schema=public
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution_redis:6379
      - CACHE_REDIS_PREFIX_KEY=evolution
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=https://ldfcqxeehgaftxsgxkag.supabase.co/functions/v1/whatsapp-integration
      - WEBHOOK_EVENTS=MESSAGES_UPSERT,MESSAGES_UPDATE,MESSAGES_SET,SEND_MESSAGE,CONNECTION_UP
    depends_on:
      evolution_db:
        condition: service_healthy
      evolution_redis:
        condition: service_started
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  evolution_postgres_data:
  evolution_instances:
