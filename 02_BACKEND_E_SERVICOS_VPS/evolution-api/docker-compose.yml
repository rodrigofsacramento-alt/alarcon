# docker-compose.yml — Evolution API (WhatsApp gateway) para o broker AHUT
# Local: 02_BACKEND_E_SERVICOS_VPS/evolution-api/
# Uso:  copie o .env-exemplo para .env, preencha a AUTHENTICATION_API_KEY, rode `docker compose up -d`
# Homologação primeiro (teste-ahut-ecosystem). NÃO subir em produção sem validação.

version: "3.8"

services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Conecta no redis e postgres da própria stack
      # ⚠️ REDIS para cache/fila: usar CACHE_REDIS_* (nome certo). 'REDIS_URI' é OBSOLETO e causa "redis disconnected".
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution_ahut
      CACHE_REDIS_SAVE_INSTANCES: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@postgres:5432/evolution
    depends_on:
      - postgres
      - redis
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution-net
    # Healthcheck: permite saber se o gateway está vivo
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: evolution_postgres
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution   # trocar por senha forte local em produção
      POSTGRES_DB: evolution
    ports:
      - "5433:5432"     # exposta em 5433 p/ não conflitar com outro Postgres da VPS
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data
    networks:
      - evolution-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: always
    ports:
      - "6380:6379"     # exposta em 6380 p/ não conflitar
    volumes:
      - evolution_redisdata:/data
    networks:
      - evolution-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  evolution_instances:
  evolution_pgdata:
  evolution_redisdata:

networks:
  evolution-net:
    driver: bridge