name: squad-commands
label: Comandos do Squad Ahut
kind: agent
version: 1.2.0
description: >
  Registra os 6 slash commands do Squad Tech Ahut (/go, /performance,
  /criar-agente, /evolucao, /resumo, /tck). /go substitui o antigo /executar
  (renomeado 23/09, gates inalterados). /tck (CC-08) e o ATEM — gerente de
  chamados TCK: executa os 4 gatilhos de validacao do Comandante pelo
  Telegram (criar/planejar/atualizar/finalizar) com confirmacao obrigatoria
  antes de qualquer escrita, via Supabase service role (keys_ahut.py) e
  estado corrente em /tmp/tck_current.json.
author: Hermes OS (Jarvis Orchestrator)
