name: squad-commands
label: Comandos do Squad Ahut
kind: agent
version: 1.1.0
description: >
  Registra os 5 slash commands de orquestracao do Squad Tech Ahut
  (/go, /performance, /criar-agente, /evolucao, /resumo). /go substitui o
  antigo /executar (renomeado 23/09, gates inalterados). Cada um injeta as
  instrucoes deterministas de orquestracao (guias + skill minima) para o
  agente Hermes executar de forma real no Telegram: JARVIS despacha e
  revisa nos gates, AXIOM orquestra os agentes executores.
author: Hermes OS (Jarvis Orchestrator)
